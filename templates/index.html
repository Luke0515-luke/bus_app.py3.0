<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 台南公車 AI 助理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body id="body-root">

<button id="btn-mobile-menu" class="mobile-menu-btn" aria-label="開啟選單">☰</button>
<div id="sidebar-backdrop"></div>

<div id="app">

  <!-- ══════════════ 左側常駐側邊欄 ══════════════ -->
  <aside id="sidebar">
    <h1 class="sidebar-title">🚌 台南公車助理</h1>

    <button id="btn-font-toggle" class="btn btn-block">🔠 放大字體（視障輔助）</button>
    <button id="btn-page-toggle" class="btn btn-block">🗺️ 公車即時地圖</button>

    <hr>

    <button id="btn-chat-history-toggle" class="btn btn-block">💬 AI 對話記錄</button>
    <div id="chat-history-panel" class="hidden">
      <h3>📋 對話記錄</h3>
      <button id="btn-new-chat" class="btn btn-block">➕ 新對話</button>
      <div id="chat-session-list"></div>
      <hr>
    </div>

    <div id="favorites-section" class="hidden">
      <h3>⭐ 最愛路線</h3>
      <div id="favorites-list"></div>
      <hr>
    </div>

    <div id="recent-section" class="hidden">
      <h3>🕐 最近查詢</h3>
      <div id="recent-list"></div>
      <hr>
    </div>

    <!-- 進階查詢 -->
    <details class="expander">
      <summary>🔍 進階查詢（站到站）</summary>
      <p class="caption">輸入起站與終點，找出直達或轉乘一次的路線</p>
      <div id="adv-search-body">
        <label>出發站</label>
        <select id="adv-start"><option value="">請選擇或輸入站名...</option></select>
        <label>目的站</label>
        <select id="adv-end"><option value="">請選擇或輸入站名...</option></select>
        <button id="btn-adv-search" class="btn btn-block">🔎 查詢路線</button>
        <div id="adv-search-result"></div>
      </div>
    </details>

    <!-- 客運查詢 -->
    <details class="expander">
      <summary>🚍 客運查詢</summary>
      <p class="caption">選擇業者與起訖站查詢班次</p>
      <label>選擇客運業者</label>
      <select id="ic-operator">
        {% for name, opid in intercity_operators.items() %}
        <option value="{{ opid or '' }}">{{ name }}</option>
        {% endfor %}
      </select>
      <div id="ic-body" class="hidden">
        <label>起點站（含關鍵字即可）</label>
        <input type="text" id="ic-dep" placeholder="例：台南、嘉義">
        <label>目的站（含關鍵字即可）</label>
        <input type="text" id="ic-dest" placeholder="例：台北、高雄">
        <div id="ic-result"></div>
      </div>
    </details>

    <!-- 系統維護 -->
    <details class="expander">
      <summary>⚙️ 系統維護</summary>
      <button id="btn-update-cache" class="btn btn-block">🔄 更新全台南站點快取</button>
      <div id="cache-status"></div>
    </details>
  </aside>

  <!-- ══════════════ 主內容區 ══════════════ -->
  <main id="main-content">

    <!-- ─────────── 查詢頁面 ─────────── -->
    <section id="page-query" class="page">
      <h2>🚌 台南公車即時時刻查詢</h2>

      <div class="query-columns">
        <!-- 左欄：路線篩選 -->
        <div class="query-left">
          <h3>🔍 路線篩選</h3>
          <p class="caption">點選顏色或數字篩選：</p>

          <div class="filter-grid">
            <button class="filter-btn" data-f="綠">綠</button>
            <button class="filter-btn" data-f="橘">橘</button>
            <button class="filter-btn" data-f="1">1</button>
            <button class="filter-btn" data-f="2">2</button>

            <button class="filter-btn" data-f="棕">棕</button>
            <button class="filter-btn" data-f="藍">藍</button>
            <button class="filter-btn" data-f="3">3</button>
            <button class="filter-btn" data-f="4">4</button>

            <button class="filter-btn" data-f="紅">紅</button>
            <button class="filter-btn" data-f="黃">黃</button>
            <button class="filter-btn" data-f="5">5</button>
            <button class="filter-btn" data-f="6">6</button>

            <button class="filter-btn" data-f="市區">市區</button>
            <button class="filter-btn" data-f="高鐵">高鐵</button>
            <button class="filter-btn" data-f="7">7</button>
            <button class="filter-btn" data-f="8">8</button>

            <button class="filter-btn" data-f="觀光">觀光</button>
            <button class="filter-btn" data-f="9">9</button>
            <button class="filter-btn" data-f="0">0</button>
          </div>
          <button id="btn-clear-filter" class="btn btn-block">❌ 清除篩選</button>
          <div id="filter-status" class="info-box">顯示：全部路線</div>

          <label>選擇路線</label>
          <select id="route-select"><option value="">請選擇或輸入路線...</option></select>

          <button id="btn-fav-toggle" class="btn btn-block hidden">☆ 加入最愛</button>

          <div id="stop-select-body" class="hidden">
            <label>等候站</label>
            <select id="start-select"></select>
            <label>目的地</label>
            <select id="end-select"></select>
          </div>
          <div id="route-hint" class="info-box">請選擇路線</div>

          <hr>

          <h3>📍 附近公車站</h3>
          <button id="btn-gps" class="btn btn-block">📡 自動取得座標</button>
          <div class="gps-coords">
            緯度：<input id="lat-disp" readonly placeholder="點上方取得">
          </div>
          <div class="gps-coords">
            經度：<input id="lon-disp" readonly placeholder="點上方取得">
          </div>
          <label>緯度</label>
          <input type="text" id="gps-lat-in" placeholder="例：22.9997">
          <label>經度</label>
          <input type="text" id="gps-lon-in" placeholder="例：120.2270">
          <button id="btn-search-nearby" class="btn btn-block">🔍 搜尋附近站牌</button>
          <div id="nearby-result"></div>
        </div>

        <!-- 右欄：即時動態 -->
        <div class="query-right">
          <div id="weather-box" class="info-box hidden"></div>

          <div id="status-box" class="hidden">
            <h3 id="status-title"></h3>
            <div class="dir-buttons">
              <button id="btn-dir0" class="btn dir-btn">➡️ 往</button>
              <button id="btn-dir1" class="btn dir-btn">⬅️ 往</button>
              <button id="btn-refresh-status" class="btn">🔄 重新整理</button>
            </div>
            <div id="ubike-suggestion" class="success-box hidden"></div>
            <div id="timeline-container" class="timeline-container"></div>
            <div class="tts-buttons">
              <button id="btn-tts-speak" class="btn tts-btn">🔊 朗讀公車資訊</button>
              <button id="btn-tts-stop" class="btn tts-btn-stop">⏹ 停止</button>
            </div>
          </div>
          <div id="status-empty" class="info-box">👈 請從左側選擇路線開始查詢</div>
        </div>
      </div>

      <!-- AI 助理：置於頁面最底部，跨欄滿版 -->
      <div class="query-ai-section">
        <hr>
        <h3>🤖 AI 助理</h3>
        <div class="caption">目前對話：<b id="chat-current-title"></b></div>
        <div id="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="有什麼我可以幫忙的嗎？">
          <button id="btn-chat-send" class="btn">送出</button>
        </div>
      </div>
    </section>

    <!-- ─────────── 地圖頁面 ─────────── -->
    <section id="page-map" class="page hidden">
      <div id="map-app">
        <div id="map-panel">
          <div id="map-panel-header">🚌 台南公車即時地圖</div>
          <div id="map-panel-body">
            <div id="map-panel-controls">
              <input id="map-route-input" type="text" placeholder="篩選路線（留空或輸入「全部」＝顯示全部路線），例：藍幹線, 綠1">
              <div class="map-btn-row">
                <button id="btn-map-refresh" class="btn">🔄 更新</button>
                <button id="btn-map-home" class="btn">🏠 回查詢頁</button>
              </div>
              <div id="map-caption" class="caption"></div>
              <button id="btn-toggle-bus-list" class="btn btn-block hidden"></button>
              <div id="map-bus-list" class="hidden" style="max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;"></div>
              <hr class="map-panel-divider">
              <label class="map-panel-label">💾 抓取並儲存路線原始資料（Shape＋StopOfRoute）</label>
              <input id="save-route-input" type="text" placeholder="輸入路線名稱，例：棕幹線">
              <button id="btn-save-route-coords" class="btn btn-block">💾 抓取並儲存到檔案</button>
              <div id="save-route-status" class="caption"></div>
            </div>
            <div id="map-panel-stats">載入中...</div>
            <div class="caption" style="padding: 0 12px 6px;">💡 放大地圖至街道等級即可看到各站站名；任何縮放層級皆可點擊圓點查看站名</div>
            <input id="map-search-box" type="text" placeholder="搜尋路線...">
            <div id="map-route-list"></div>
          </div>
        </div>
        <div id="leaflet-map"></div>
      </div>
    </section>

  </main>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
